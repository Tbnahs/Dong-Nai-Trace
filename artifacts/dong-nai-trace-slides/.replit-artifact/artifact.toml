kind = "slides"
previewPath = "/dong-nai-trace-slides/"
title = "Đồng Nai Trace — Giới thiệu dự án"
version = "1.0.0"
id = "artifacts/dong-nai-trace-slides"
router = "path"

[[services]]
name = "web"
paths = [ "/dong-nai-trace-slides/" ]
localPort = 26113

[services.development]
run = "pnpm --filter @workspace/dong-nai-trace-slides run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dong-nai-trace-slides", "run", "build" ]
serve = "static"
publicDir = "artifacts/dong-nai-trace-slides/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26113"
BASE_PATH = "/dong-nai-trace-slides/"
