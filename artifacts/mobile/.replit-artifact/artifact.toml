kind = "mobile"
previewPath = "/mobile/"
title = "Đồng Nai Trace — Mobile"
description = "Mobile companion app for the Đồng Nai Trace traceability portal. Lets consumers search and trace agricultural products by QR/trace code or GTIN+lot, view product and business profiles, read news, manage notifications, and handle enterprise account registration and profile management."
version = "1.0.0"
id = "artifacts/mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 18115

[services.development]
run = "pnpm --filter @workspace/mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mobile", "run", "serve" ]

[services.env]
PORT = "18115"
BASE_PATH = "/mobile/"
